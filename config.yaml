# Default application settings for VinylSync.
audio:
  # Stable source ID, such as input:0 or loopback:3. Null selects the default source.
  source_id: null
  # Capture sample rate for the active source.
  sample_rate: 44100
  # Number of seconds retained in the circular buffer.
  buffer_seconds: 15
  # Gain applied before spectrum analysis and silence detection.
  gain_db: 0
  # Default system noise threshold for recording devices.
  silence_threshold_db: -40

recognition:
  # Available values: shazam, acrcloud, audd.
  provider: shazam
  # Re-identify the active song after this many seconds.
  interval_seconds: 45
  # Minimum sustained signal before a recognition attempt is triggered.
  min_signal_seconds: 1.0
  # Minimum silence duration to consider that a pause occurred (does not discard the track on its own).
  track_gap_seconds: 1.5
  # Maximum silence duration during a track before assuming playback has stopped.
  break_max_seconds: 10
  # Margin before track end to treat a silence as a track boundary.
  end_margin_seconds: 10
  # Silence duration after which the player returns to the visualizer.
  idle_timeout_seconds: 20
  # Minimum new audio sample length before a recognition attempt can restart after silence.
  min_sample_seconds: 5
  shazam:
    enabled: true
  acrcloud:
    enabled: false
    host: null
    access_key: null
    access_secret: null
  audd:
    enabled: false
    api_token: null

lyrics:
  # LRCLIB API base URL.
  lrclib_base_url: https://lrclib.net/api
  # User-Agent sent to LRCLIB.
  user_agent: VinylSync/0.1.0
  # Local SQLite cache path.
  cache_path: data/lyrics.sqlite3

server:
  host: 127.0.0.1
  port: 8000
  # Extra hostnames permitted when exposing the app on a local network.
  allowed_hosts: []

# UI defaults that are persisted in settings.json and override config.yaml at runtime.
ui:
  font_size: 1.0
  manual_offset_seconds: 0.0
