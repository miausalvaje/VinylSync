[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinylsync"
version = "0.1.0"
description = "A local synchronized lyrics display for turntable audio"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "miausalvaje" }]
requires-python = ">=3.11"
keywords = ["lyrics", "music", "vinyl", "audio", "shazam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sounddevice>=0.5",
    "numpy>=2.0,<2.5",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
    "shazamio>=0.8",
    "pyaudiowpatch>=0.2.12; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/miausalvaje/VinylSync"
Repository = "https://github.com/miausalvaje/VinylSync"
Issues = "https://github.com/miausalvaje/VinylSync/issues"

[project.scripts]
vinylsync = "vinyl_lyrics.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
packages = ["vinyl_lyrics"]
mypy_path = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
