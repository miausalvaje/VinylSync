<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090a0e">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/visualizer.css">
    <link rel="stylesheet" href="/css/lyrics.css">
    <link rel="stylesheet" href="/css/settings.css">
    <link rel="stylesheet" href="/css/modal.css">
    <title>VinylSync</title>
  </head>
  <body>
    <main id="app">
      <section id="visualizer-view" class="view view--active" aria-label="Audio visualizer">
        <canvas id="visualizer-canvas"></canvas>
        <div class="visualizer-hud">
          <span id="connection-status" class="status-pill">Connecting…</span>
          <span id="source-label">Listening…</span>
        </div>
        <div id="visualizer-message" class="visualizer-message">
          <img src="/favicon.svg" alt="" width="72" height="72">
          <p>Listening…</p>
          <small id="state-label">Waiting for audio</small>
          <small id="identifying-indicator" hidden>Identifying track…</small>
        </div>
      </section>

      <section id="lyrics-view" class="view" aria-label="Synchronized lyrics" aria-hidden="true">
        <div id="artwork-backdrop" class="artwork-backdrop"></div>
        <div class="lyrics-shell">
          <div class="track-column">
            <img id="track-artwork" class="track-artwork" src="/favicon.svg" alt="Album artwork">
            <p id="track-artist" class="track-artist">Waiting for track</p>
            <h1 id="track-title">VinylSync</h1>
            <div class="track-actions">
              <span id="track-lock" hidden aria-label="Track locked">🔒</span>
              <button id="unlock-track" class="secondary-button" type="button" hidden>Unlock</button>
            </div>
            <button id="manual-search-button" class="secondary-button" type="button">Correct track</button>
          </div>
          <div class="lyrics-column">
            <div id="lyrics-lines" class="lyrics-lines">
              <p class="lyrics-placeholder">Lyrics will appear here.</p>
            </div>
          </div>
        </div>
      </section>

      <button id="settings-button" class="floating-button" type="button" aria-label="Open settings">⚙</button>
      <aside id="settings-panel" class="side-panel" aria-hidden="true">
        <button class="panel-close" data-close-panel="settings-panel" type="button" aria-label="Close settings">×</button>
        <h2>Settings</h2>
        <label for="source-select">Audio source</label>
        <select id="source-select"></select>
        <label for="gain-slider">Gain <output id="gain-value">0 dB</output></label>
        <input id="gain-slider" type="range" min="-30" max="30" step="0.5" value="0">
        <label for="threshold-slider">Silence threshold <output id="threshold-value">-48 dBFS</output></label>
        <input id="threshold-slider" type="range" min="-90" max="-5" step="1" value="-48">
        <div id="level-meter" class="level-meter" aria-label="Input level">
          <span id="threshold-marker"></span>
        </div>
        <div id="settings-error" class="settings-error" hidden></div>
        <label for="font-slider">Font size <output id="font-value">1×</output></label>
        <input id="font-slider" type="range" min="0.5" max="3" step="0.1" value="1">
        <div class="offset-controls">
          <span>Manual offset</span>
          <button id="offset-down" type="button">−0.5 s</button>
          <output id="offset-value">0 s</output>
          <button id="offset-up" type="button">+0.5 s</button>
        </div>
      </aside>

      <dialog id="search-dialog" class="search-dialog">
        <form method="dialog" class="search-form">
          <button class="panel-close" value="cancel" type="submit" aria-label="Close search">×</button>
          <h2>Correct track</h2>
          <label for="track-search">Search LRCLIB</label>
          <input id="track-search" type="search" autocomplete="off" placeholder="Artist or song title">
          <div id="search-results" class="search-results"></div>
        </form>
      </dialog>
    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
